name: Release

on:
  push:

permissions:
  contents: write

jobs:
  create_client_on_android_release:
    name: Create client on Android release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "32.x"
      - name: Install requests
        run: pip install requests
      - name: About code generate
        run: python script/generate_about_code.py --version ${{ github.ref_name }} --commit_sha ${{ github.sha }} --enable_version_check
      - name: Git PAT Auth
        env:
          PAT: ${{ secrets.PAT }}
        shell: pwsh
        run: |
          git config --global url."https://${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${PAT}@github.com/".insteadOf "git@github.com:"
      - name: Flutter Init
        run: cd client && flutter pub get
      - name: Grpc generate
        run: dart pub global activate protoc_plugin 23.0.0 && python script/generate.pb.dart.py
      - name: Drift generate
        run: cd client && dart run build_runner build
      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev
      - name: Build Release
        run: cd client && flutter build apk --split-per-abi && flutter build apk
      - name: Rename armeabi-v7a apk
        run: mv client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_armeabi-v7a.apk
      - name: Rename arm64-v8a apk
        run: mv client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_arm64-v8a.apk
      - name: Rename x86_64 apk
        run: mv client/build/app/outputs/flutter-apk/app-x86_64-release.apk  client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_x86_64.apk
      - name: Rename universal apk
        run: mv client/build/app/outputs/flutter-apk/app-x86_64-release.apk  client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_universal.apk
      - name: Release to Github
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_armeabi-v7a.apk
            client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_arm64-v8a.apk
            client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_x86_64.apk
            client/build/app/outputs/flutter-apk/OurChat_${{github.ref_name}}_universal.apk